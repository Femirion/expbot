spring:
  application:
    name: expbot
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/expbot}
    username: ${JDBC_DATABASE_USERNAME:expbot}
    password: ${JDBC_DATABASE_PASSWORD:expbot}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

expbot:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  google-sheets:
    enabled: ${GOOGLE_SHEETS_ENABLED:false}
    spreadsheet-id: ${GOOGLE_SHEETS_SPREADSHEET_ID:}
    range: "${GOOGLE_SHEETS_RANGE:Transactions!A:I}"
    service-account-json: ${GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON:}
