version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: expbot-postgres
    restart: always
    environment:
      POSTGRES_DB: expbot
      POSTGRES_USER: expbot
      POSTGRES_PASSWORD: expbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: